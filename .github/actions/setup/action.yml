# The steps shared by the jobs which build the images with Castor. Shared by
# docker-starter with its projects, and updated by "castor starter:sync": run it after
# actions/checkout, which brings it.
name: Set up docker-starter
description: Sets up Docker Buildx, logs in to the GitHub registry (cache and images), and installs Castor

runs:
    using: composite
    steps:
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

        - name: Log in to registry
          shell: bash
          env:
              GITHUB_TOKEN: ${{ github.token }}
              GITHUB_ACTOR: ${{ github.actor }}
          run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

        - name: setup-castor
          uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0
