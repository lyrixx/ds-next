name: Build and push production images

"on":
    push:
        branches: ["main"]
        tags: ["*"]

permissions:
    contents: read
    packages: write

env:
    # Fix for symfony/color detection. We know GitHub Actions can handle it
    ANSICON: 1
    CASTOR_CONTEXT: prod
    REGISTRY: "ghcr.io/${{ github.repository }}"

jobs:
    build-push:
        name: Build and push production images
        # Set the PUSH_PRODUCTION_IMAGES repository variable to "true"
        # (Settings > Secrets and variables > Actions > Variables) to enable it
        if: vars.PUSH_PRODUCTION_IMAGES == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Set up Docker Buildx, the registry and Castor
              uses: ./.github/actions/setup

            # Images are tagged with the short commit sha (what a deployment should
            # reference), "latest" on main, and the git tag when there is one
            - name: "Build and push the production images"
              shell: bash
              run: |
                  tags=(--tag="${GITHUB_SHA::7}")
                  if [ "${GITHUB_REF_NAME}" = main ]; then tags+=(--tag=latest); fi
                  if [ "${GITHUB_REF_TYPE}" = tag ]; then tags+=(--tag="${GITHUB_REF_NAME}"); fi
                  castor docker:push "${tags[@]}"
