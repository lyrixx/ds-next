name: Continuous Integration

"on":
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    schedule:
        - cron: "0 0 * * MON"

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: read

env:
    # Fix for symfony/color detection. We know GitHub Actions can handle it
    ANSICON: 1
    CASTOR_CONTEXT: ci
    REGISTRY: "ghcr.io/${{ github.repository }}"

# >>> docker-starter only
# The "docker-starter only" blocks test docker-starter itself: `castor init`
# removes them, the rest is the CI of your project.
# <<< docker-starter only
jobs:
    check-dockerfiles:
        name: Check Dockerfile
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Check php/Dockerfile
              uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
              with:
                  dockerfile: infrastructure/docker/services/php/Dockerfile

    # >>> docker-starter only
    castor-tasks:
        name: Test the shared castor tasks
        runs-on: ubuntu-latest
        steps:
            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: "Run the tests"
              run: "castor test:starter"

    root-layout:
        name: Test with the application at the repository root
        runs-on: ubuntu-latest
        env:
            DS_APP_DIR: ""
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Set up Docker Buildx, the registry and Castor
              uses: ./.github/actions/setup

            - name: "Move the application to the repository root"
              run: |
                  set -e
                  shopt -s dotglob
                  mv application/* .
                  rmdir application
                  printf '%s\n' .castor .github .home infrastructure tools >> .dockerignore

            - name: "Build and start the infrastructure"
              run: "castor start"

            - name: "Test HTTP server"
              run: |
                  set -e
                  set -o pipefail

                  curl --fail --insecure --silent --retry 5 --retry-all-errors -H "Host: app.test" https://127.0.0.1 | grep "Hello world"

            - name: "Test builder"
              run: "castor builder -- pwd | grep -x /var/www"

            - name: "Build and start the production images"
              run: "castor start"
              env:
                  CASTOR_CONTEXT: prod

            - name: "Test production HTTP server"
              run: |
                  set -e
                  set -o pipefail

                  curl --fail --silent --retry 5 --retry-all-errors http://127.0.0.1:8000 | grep "Environment: prod"
                  CASTOR_CONTEXT=prod castor builder -- pwd | grep -x /var/www

    frankenphp:
        name: Test with FrankenPHP
        runs-on: ubuntu-latest
        env:
            DS_PHP_SERVER: frankenphp
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Set up Docker Buildx, the registry and Castor
              uses: ./.github/actions/setup

            - name: "Build and start the infrastructure"
              run: "castor start"

            - name: "Test HTTP server"
              run: |
                  set -e
                  set -o pipefail

                  curl --fail --insecure --silent --retry 5 --retry-all-errors -H "Host: app.test" https://127.0.0.1 | grep "Hello world"

            - name: "Test the PHP extensions"
              run: |
                  set -e
                  set -o pipefail

                  castor builder -- php -m | tee /tmp/modules.txt
                  for module in amqp apcu intl pdo_mysql pdo_pgsql redis uuid; do
                      grep -x "${module}" /tmp/modules.txt
                  done

            - name: "Build and start the production images"
              run: "castor start"
              env:
                  CASTOR_CONTEXT: prod

            - name: "Test production HTTP server"
              run: |
                  set -e
                  set -o pipefail

                  curl --fail --silent --retry 5 --retry-all-errors http://127.0.0.1:8000 | grep "Environment: prod"

    # <<< docker-starter only
    prod-images:
        name: Test production images
        runs-on: ubuntu-latest
        env:
            CASTOR_CONTEXT: prod
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Set up Docker Buildx, the registry and Castor
              uses: ./.github/actions/setup

            - name: "Build and start the production images"
              run: "castor start"

            # Add some checks of your application, e.g. the status code of the homepage
            - name: "Test HTTP server"
              run: |
                  set -e
                  set -o pipefail

                  # >>> docker-starter only
                  curl --fail --silent http://127.0.0.1:8000 | grep "Hello world"
                  curl --fail --silent http://127.0.0.1:8000 | grep "Environment: prod"
                  # <<< docker-starter only
                  test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/index.php)" = 404

            - name: "Test the php image runs as a non-root user"
              run: "castor builder -- id -u | grep -x 1000"

    ci:
        # >>> docker-starter only: every supported PHP version is tested (`castor
        # init` also removes the PHP version from the job name)
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.3", "8.4", "8.5"]
        env:
            DS_PHP_VERSION: ${{ matrix.php-version }}
        # <<< docker-starter only
        name: Test with PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Set up Docker Buildx, the registry and Castor
              uses: ./.github/actions/setup

            - name: "Build and start the infrastructure"
              run: "castor start"

            - name: "Check Security issues"
              run: "castor qa:security-audit"

            - name: "Check PHP coding standards"
              run: "castor qa:cs --dry-run"

            - name: "Check Twig coding standards"
              run: "castor qa:twig-cs --dry-run"

            - name: "Run PHPStan"
              run: "castor qa:phpstan"

            - name: "Run PHPUnit"
              run: "castor qa:phpunit"

            # >>> docker-starter only
            - name: "Test docker:push"
              run: "castor test:push"

            - name: "Test commands with and without a terminal"
              run: "castor test:terminal"

            - name: "Test HTTP server"
              run: |
                  set -e
                  set -o pipefail

                  curl --fail --insecure --silent -H "Host: app.test" https://127.0.0.1 | grep "Hello world"
                  curl --fail --insecure --silent -H "Host: app.test" https://127.0.0.1 | grep "${{ matrix.php-version }}"

            - name: "Test builder"
              run: |
                  set -e
                  set -o pipefail

                  cat > .castor/test.php <<'EOPHP'
                  <?php

                  use Castor\Attribute\AsTask;
                  use function docker\docker_compose_run;

                  #[AsTask()]
                  function test()
                  {
                      docker_compose_run(['echo', 'Hello World']);
                  }

                  #[AsTask()]
                  function app_env()
                  {
                      docker_compose_run(['php', 'public/index.php']);
                  }
                  EOPHP

                  castor test | grep "Hello World"
                  CASTOR_CONTEXT=default castor app-env | grep 'Environment: not set'
                  CASTOR_CONTEXT=test castor app-env | grep 'Environment: test'

            - name: "Test communication with DB"
              run: |
                  set -e
                  set -o pipefail

                  cat > application/public/index.php <<'EOPHP'
                  <?php
                  $pdo = new PDO('pgsql:host=postgres;dbname=app', 'app', 'app');
                  $pdo->exec('CREATE TABLE test (id integer NOT NULL)');
                  $pdo->exec('INSERT INTO test VALUES (1)');
                  echo $pdo->query('SELECT * from test')->fetchAll() ? 'database OK' : 'database KO';
                  EOPHP

                  # FPM seems super slow to detect the change, we need to wait a bit
                  sleep 3

                  curl --fail --insecure --silent -H "Host: app.test" https://127.0.0.1 | grep "database OK"

            # docker-starter has all the extensions (`castor init` only keeps postgres)
            - name: "Test the extensions"
              run: |
                  set -e
                  set -o pipefail

                  cat > application/extensions.php <<'EOPHP'
                  <?php
                  $mariadb = new PDO('mysql:host=mariadb;dbname=app', 'app', 'app');
                  echo 'mariadb ', $mariadb->query('SELECT 1')->fetchColumn(), "\n";
                  $redis = new Redis();
                  $redis->connect('redis');
                  echo 'redis ', $redis->ping() ? 1 : 0, "\n";
                  $rabbitmq = new AMQPConnection(['host' => 'rabbitmq', 'login' => 'app', 'password' => 'app']);
                  $rabbitmq->connect();
                  echo 'rabbitmq ', (int) $rabbitmq->isConnected(), "\n";
                  echo 'meilisearch ', json_decode(file_get_contents('http://meilisearch:7700/health'), true)['status'], "\n";
                  echo 'mailpit ', json_decode(file_get_contents('http://mailpit:8025/api/v1/info'), true)['Version'] ? 1 : 0, "\n";
                  echo 'elasticsearch ', json_decode(file_get_contents('http://elasticsearch:9200/_cluster/health'), true)['status'], "\n";
                  echo 'clickhouse ', trim(file_get_contents('http://app:app@clickhouse:8123/?query=SELECT%201')), "\n";
                  echo 'gotenberg ', json_decode(file_get_contents('http://gotenberg:3000/health'), true)['status'], "\n";
                  echo 'chrome ', isset(json_decode(file_get_contents('http://chrome:3000/json/version'), true)['Browser']) ? 1 : 0, "\n";
                  $base64 = static fn (string $data) => rtrim(strtr(base64_encode($data), '+/', '-_'), '=');
                  $jwt = $base64('{"alg":"HS256","typ":"JWT"}') . '.' . $base64('{"mercure":{"publish":["*"]}}');
                  $jwt .= '.' . $base64(hash_hmac('sha256', $jwt, '!ChangeThisMercureHubJWTSecretKey!', true));
                  echo 'mercure ', file_get_contents('http://mercure/.well-known/mercure', false, stream_context_create(['http' => [
                      'method' => 'POST',
                      'header' => "Authorization: Bearer {$jwt}\r\nContent-Type: application/x-www-form-urlencoded",
                      'content' => 'topic=test&data=hello',
                  ]])) ? 1 : 0, "\n";
                  EOPHP

                  castor builder -- php extensions.php | tee /tmp/extensions.txt
                  grep -x "mariadb 1" /tmp/extensions.txt
                  grep -x "redis 1" /tmp/extensions.txt
                  grep -x "rabbitmq 1" /tmp/extensions.txt
                  grep -x "meilisearch available" /tmp/extensions.txt
                  grep -x "mailpit 1" /tmp/extensions.txt
                  grep -E -x "elasticsearch (green|yellow)" /tmp/extensions.txt
                  grep -x "clickhouse 1" /tmp/extensions.txt
                  grep -x "gotenberg up" /tmp/extensions.txt
                  grep -x "chrome 1" /tmp/extensions.txt
                  grep -x "mercure 1" /tmp/extensions.txt

                  castor postgres -- "SELECT 'postgres task OK';" | grep "postgres task OK"
                  castor mariadb -- "SELECT 'mariadb task OK';" | grep "mariadb task OK"
                  castor clickhouse -- "SELECT 'clickhouse task OK'" | grep "clickhouse task OK"
                  castor demo:call | grep "Hostname"

                  for host in clickhouse demo elasticsearch mailpit meilisearch rabbitmq redis; do
                      curl --fail --insecure --silent --output /dev/null -H "Host: ${host}.app.test" https://127.0.0.1
                  done
                  # Kibana takes a while to start
                  curl --fail --insecure --silent --output /dev/null --retry 30 --retry-delay 5 --retry-all-errors -H "Host: kibana.app.test" https://127.0.0.1/api/status

                  # The reverse proxies: redirection.io, then Varnish, then nginx
                  curl --fail --insecure --silent --dump-header - --output /dev/null -H "Host: app.test" https://127.0.0.1 | grep -i "^x-cache: MISS"
                  # Mercure, on the domain of the application
                  curl --insecure --silent -H "Host: app.test" "https://127.0.0.1/.well-known/mercure?topic=test" --max-time 2 --output /dev/null --write-out '%{http_code}' | grep -x 200 || [ $? -eq 28 ]
            # <<< docker-starter only
