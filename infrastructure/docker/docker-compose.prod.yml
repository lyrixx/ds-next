# Production images: self-contained (code baked in, no bind mounts), non-root,
# see the "Production stages" of services/php/Dockerfile.
#
# This file is only meant for LOCAL TESTING of those images, through the "prod"
# castor context: `castor build -c prod` and `castor docker:push -c prod --tag=...`
# build and push the "php" and "nginx" images (the CI does it on every push to
# main), `castor start -c prod` runs them in a minimal stack (dummy secrets, a
# throwaway database). The real production is not run with this file: the
# hosting orchestrator runs the images with its own database.
#
# Shared by docker-starter with its projects, and updated by "castor starter:sync": add
# the services of the project to docker-compose.prod.project.yml rather than here (see
# docker-compose.yml).

x-php-build: &php-build
    context: services/php
    additional_contexts:
        # APP_DIR is empty when the application lives at the root of the repository
        app: "../../${APP_DIR-application}"
    args:
        PHP_VERSION: "${PHP_VERSION:-8.5}"
        APP_PATH: "${APP_PATH:-/var/www/application}"

x-app-env: &app-env
    APP_SECRET: "${APP_SECRET:-not-a-secret}"

volumes:
    # php-fpm unix socket, shared between the php and nginx containers
    php-socket: {}

services:
    php:
        build:
            <<: *php-build
            target: php
            cache_from:
                - "type=registry,ref=${REGISTRY:-}/php:cache"
        image: "${REGISTRY:-${PROJECT_NAME}}/php:${TAG:-latest}"
        environment: *app-env
        env_file:
            # Optional, gitignored: real credentials for a local test.
            # Variables of the "environment" block above take precedence.
            - path: "../../${APP_DIR-application}/.env.prod.local"
              required: false
        volumes:
            - php-socket:/var/run/php

    nginx:
        build:
            <<: *php-build
            target: nginx
            cache_from:
                - "type=registry,ref=${REGISTRY:-}/nginx:cache"
        image: "${REGISTRY:-${PROJECT_NAME}}/nginx:${TAG:-latest}"
        ports:
            - "${HTTP_PORT:-8000}:8080"
        volumes:
            - php-socket:/var/run/php
        depends_on:
            php:
                condition: service_healthy
