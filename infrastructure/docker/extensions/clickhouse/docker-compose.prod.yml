# The clickhouse extension in the production stack (see docker-compose.yml).

volumes:
    clickhouse-data: {}

services:
    clickhouse:
        environment:
            CLICKHOUSE_DB: app
            CLICKHOUSE_USER: app
            CLICKHOUSE_PASSWORD: app
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8123/ping"]
            interval: 5s
            timeout: 5s
            retries: 10

    php:
        depends_on:
            clickhouse:
                condition: service_healthy
