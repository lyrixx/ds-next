# The meilisearch extension in the production stack (see docker-compose.yml).

volumes:
    meilisearch-data: {}

services:
    meilisearch:
        environment:
            MEILI_ENV: development
            MEILI_NO_ANALYTICS: "true"
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7700/health"]
            interval: 5s
            timeout: 5s
            retries: 5
