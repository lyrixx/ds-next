# The version of PostgreSQL, in dev and in the production stack. It belongs to the
# project: "castor starter:sync" never changes this file, since a major version cannot
# read the data of the previous one. To upgrade, dump the data (pg_dumpall), change the
# version, remove the volume, then restore the data.

services:
    postgres:
        image: postgres:16
        volumes:
            # From PostgreSQL 18, the data lives in /var/lib/postgresql
            - postgres-data:/var/lib/postgresql/data
