# The redirectionio extension of docker-starter (see README.md), updated by "castor
# starter:sync". Paths are relative to infrastructure/docker/.

services:
    redirectionio:
        build: extensions/redirectionio
        environment:
            - "REDIRECTIONIO_INSTANCE_NAME=${PROJECT_ROOT_DOMAIN} (dev)"
            # The key of the project in the manager of redirection.io, see README.md
            - "REDIRECTIONIO_PROJECT_KEY=${REDIRECTIONIO_PROJECT_KEY:-}"
            # Set by Castor, see extension.json
            - "REDIRECTIONIO_UPSTREAM=${REDIRECTIONIO_UPSTREAM}"
        volumes:
            - "./extensions/redirectionio/agent.yml:/etc/redirectionio/agent.yml:ro"
        depends_on:
            - frontend
        # Castor routes the requests of the application here (see extension.json)
        labels:
            - "traefik.enable=true"
            - "project-name=${PROJECT_NAME}"
            - "traefik.http.services.${PROJECT_NAME}-redirectionio.loadbalancer.server.port=80"
        profiles:
            - default
